name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Server
        working-directory: server
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart test

      - name: Client
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t driver-diary .
      - name: Smoke test
        run: |
          docker run -d -p 8080:8080 --name app driver-diary
          for i in $(seq 1 20); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf 'localhost:8080/trips/summary?date=2026-10-01' | grep -q '"net":12070'
          curl -sf localhost:8080/ | grep -q '<title>'
